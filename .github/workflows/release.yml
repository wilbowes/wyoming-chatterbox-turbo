name: Release (Docker image)

# A vX.Y.Z tag publishes ghcr.io/<owner>/wyoming-chatterbox-turbo:X.Y.Z and
# :latest for linux/amd64 (CUDA). Run by hand, it builds and checks the image
# without publishing. There is no arm64 image: the model needs an NVIDIA GPU.
#
# Plain docker rather than buildx: the image is about 20 GB, and buildx would
# hold it once in its own cache and again in the image store to run it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wyoming-chatterbox-turbo

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # provenance attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # git allows $ ( ) ; in a tag name and the version is used in later
      # steps, so anything that is not a plain version stops here.
      - name: Version from the tag
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo "::error::tag is not vX.Y.Z"; exit 1; }
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # A hosted runner has about 14 GB free and the CUDA base image alone
      # does not fit. Without this the build dies with a disk error that
      # reads like a broken Dockerfile.
      - name: Reclaim runner disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.description=Wyoming text-to-speech from Chatterbox-Turbo voice clones" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" .
          docker image ls "${IMAGE}"; df -h / | tail -1

      # No GPU here, so the model is never loaded. This proves the pinned
      # packages install into something that imports, and that the text
      # handling in the image is the text handling in the repository.
      - name: The image imports and prepares text
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          docker run --rm --entrypoint python "${IMAGE}:${VERSION}" -c "
          import sys; sys.path.insert(0, '/app')
          import shim, torch, chatterbox
          print('torch', torch.__version__)
          assert shim.speakable('* **Hello** there') == 'Hello there.'
          assert shim.tags('Ha (laugh) yes') == 'Ha [chuckle] yes'
          assert shim.chunks('One. Two.') == ['One. Two.']
          assert shim.chunks('# Today\n- 21°C\n- rain') == ['Today. 21 degrees. rain.']
          print('ok')"

      - name: Log in to GHCR
        if: steps.v.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: steps.v.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          digest=$(docker image inspect "${IMAGE}:${VERSION}" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -m1 "^${IMAGE}@" | cut -d@ -f2)
          echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no digest after push"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.v.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
