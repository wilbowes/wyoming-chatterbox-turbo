# Intel Arc and Core Ultra graphics (XPU): docker compose -f docker-compose.intel.yml up -d
# Needs the i915 or xe kernel driver on the host; the user-space driver is in the image.
services:
  wyoming-chatterbox-turbo:
    image: ghcr.io/wilbowes/wyoming-chatterbox-turbo:xpu
    build:
      context: .
      dockerfile: Dockerfile.wheels
      args:
        BACKEND: xpu
    container_name: wyoming-chatterbox-turbo
    restart: unless-stopped
    devices:
      - /dev/dri
    ports:
      - "10304:10304"
    volumes:
      - ./voices:/voices:ro
      - ./hf-cache:/root/.cache/huggingface
